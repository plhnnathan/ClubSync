<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#00c853" />
    <title>ClubSync — Football Club Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/auth.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
  </head>
  <body class="light">
    <nav id="navbar" class="hidden">
      <button class="nav-toggle" id="navToggle" aria-label="Menu">☰</button>
      <div class="nav-brand">
        <span class="nav-logo">⚽</span>
        <span>Club<b>Sync</b></span>
      </div>
      <div class="nav-links" id="navLinks">
        <button class="nav-btn" data-nav="dashboard" data-i18n="nav_dashboard">
          Dashboard
        </button>
        <button class="nav-btn" data-nav="players" data-i18n="nav_players">
          Players
        </button>
        <button class="nav-btn" data-nav="reports" data-i18n="nav_reports">
          Match Reports
        </button>
        <button class="nav-btn" data-nav="settings" data-i18n="nav_settings">
          Settings
        </button>
      </div>
      <div class="nav-right">
        <span id="navUser" class="nav-user"></span>
        <button
          id="langBtn"
          class="icon-btn"
          title="Language"
          onclick="cycleLang()"
        >
          🇬🇧 EN
        </button>
        <button id="themeBtn" class="icon-btn" title="Theme">🌙</button>
        <button class="btn btn-danger btn-sm btn-logout" data-i18n="nav_logout">
          Logout
        </button>
      </div>
    </nav>

    <main id="app"></main>

    <!-- Toast notifications -->
    <div id="toast-stack"></div>

    <!-- Modal Player -->
    <div class="modal-overlay hidden" id="playerModal">
      <div class="modal">
        <div class="modal-header">
          <span class="modal-title" id="playerModalTitle"></span>
          <button class="modal-close" data-close="playerModal">✕</button>
        </div>
        <div id="playerModalBody"></div>
      </div>
    </div>

    <!-- Modal Report -->
    <div class="modal-overlay hidden" id="reportModal">
      <div class="modal">
        <div class="modal-header">
          <span class="modal-title" id="reportModalTitle"></span>
          <button class="modal-close" data-close="reportModal">✕</button>
        </div>
        <div id="reportModalBody"></div>
      </div>
    </div>

    <script src="/js/i18n.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/dashboard.js"></script>
    <script src="/js/players.js"></script>
    <script src="/js/reports.js"></script>
    <script src="/js/settings.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
