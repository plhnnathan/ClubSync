<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClubSync</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <nav id="navbar" class="hidden">
      <div class="nav-brand">
        <span class="nav-logo">⚽</span>
        <span>ClubSync</span>
      </div>
      <div class="nav-links">
        <button class="nav-btn" data-nav="dashboard" data-i18n="nav_dashboard">
          Dashboard
        </button>
        <button class="nav-btn" data-nav="players" data-i18n="nav_players">
          Players
        </button>
        <button class="nav-btn" data-nav="reports" data-i18n="nav_reports">
          Match Reports
        </button>
      </div>
      <div class="nav-right">
        <span id="navUser" class="nav-user"></span>
        <button id="langBtn" class="btn-lang">🌐 PT-BR</button>
        <button class="btn-logout" data-i18n="nav_logout">Logout</button>
      </div>
    </nav>

    <main id="app"></main>

    <div class="modal-overlay hidden" id="playerModal">
      <div class="modal">
        <div class="modal-header">
          <span class="modal-title" id="playerModalTitle"></span>
          <button class="modal-close" data-close="playerModal">✕</button>
        </div>
        <div id="playerModalBody"></div>
      </div>
    </div>

    <div class="modal-overlay hidden" id="reportModal">
      <div class="modal">
        <div class="modal-header">
          <span class="modal-title" id="reportModalTitle"></span>
          <button class="modal-close" data-close="reportModal">✕</button>
        </div>
        <div id="reportModalBody"></div>
      </div>
    </div>

    <script src="/js/i18n.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/dashboard.js"></script>
    <script src="/js/players.js"></script>
    <script src="/js/reports.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
