<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#00c853" />
    <title>ClubSync — Football Club Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/auth.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
  </head>
  <body class="light">
    <aside id="sidebar" class="hidden">
      <div class="sidebar-header">
        <div class="nav-brand">
          <span class="nav-logo">⚽</span>
          <span class="brand-text">Club<b>Sync</b></span>
        </div>
      </div>

      <div class="nav-links" id="navLinks">
        <button class="nav-btn" data-nav="dashboard" title="Painel">
          <span class="nav-icon">📊</span>
          <span class="nav-text" data-i18n="nav_dashboard">Painel</span>
        </button>
        <button class="nav-btn" data-nav="players" title="Jogadores">
          <span class="nav-icon">👥</span>
          <span class="nav-text" data-i18n="nav_players">Jogadores</span>
        </button>
        <button class="nav-btn" data-nav="reports" title="Avaliações">
          <span class="nav-icon">📋</span>
          <span class="nav-text" data-i18n="nav_reports">Avaliações</span>
        </button>
        <button class="nav-btn" data-nav="games" title="Jogos">
          <span class="nav-icon">🏟️</span>
          <span class="nav-text" data-i18n="nav_games">Jogos</span>
        </button>
        <button class="nav-btn" data-nav="settings" title="Configurações">
          <span class="nav-icon">⚙️</span>
          <span class="nav-text" data-i18n="nav_settings">Configurações</span>
        </button>
      </div>

      <div class="sidebar-footer">
        <button id="collapseBtn" class="collapse-btn" title="Recolher Menu">
          <span class="collapse-icon">❮</span>
        </button>
      </div>
    </aside>

    <header id="topbar" class="hidden">
      <div class="topbar-left">
        <button class="nav-toggle" id="navToggle" aria-label="Menu">☰</button>
      </div>
      <div class="topbar-right">
        <button id="themeBtn" class="icon-btn" title="Theme">🌙</button>
        <div class="divider"></div>
        <div id="navUser" class="nav-user"></div>
        <button class="btn btn-danger btn-sm btn-logout" data-i18n="nav_logout">
          Sair
        </button>
      </div>
    </header>

    <main id="app"></main>

    <div id="toast-stack"></div>

    <div class="modal-overlay hidden" id="playerModal">
      <div class="modal">
        <div class="modal-header">
          <span class="modal-title" id="playerModalTitle"></span>
          <button class="modal-close" data-close="playerModal">✕</button>
        </div>
        <div id="playerModalBody"></div>
      </div>
    </div>

    <div class="modal-overlay hidden" id="reportModal">
      <div class="modal">
        <div class="modal-header">
          <span class="modal-title" id="reportModalTitle"></span>
          <button class="modal-close" data-close="reportModal">✕</button>
        </div>
        <div id="reportModalBody"></div>
      </div>
    </div>

    <script src="/js/i18n.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/dashboard.js"></script>
    <script src="/js/players.js"></script>
    <script src="/js/reports.js"></script>
    <script src="/js/games.js"></script>
    <script src="/js/settings.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
